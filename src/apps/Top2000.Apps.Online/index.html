<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Top2000</title>
  </head>
  <body>
  <div class="app">
      <div class="master">

          <!-- HEADER -->
          <div class="master-header">
              <h2 class="master-title">2025</h2>

              <div class="master-actions">
                  <button class="icon-btn material-symbols-outlined">sort</button>
                  <button class="icon-btn material-symbols-outlined">group_work</button>
                  <button class="icon-btn material-symbols-outlined" id="theme-toggle">light_mode</button>
              </div>
          </div>

          <!-- STATS ROW -->
          <div class="filter-buttons">
              <input type="checkbox" class="btn-check" id="btn-filter-equal" autocomplete="off">
              <label class="btn stat-equal" for="btn-filter-equal">= 14</label>

              <input type="checkbox" class="btn-check" id="btn-filter-stat-up" autocomplete="off">
              <label class="btn stat-up" for="btn-filter-stat-up">↑ 733</label>
              
              <input type="checkbox" class="btn-check" id="btn-filter-stat-down" autocomplete="off">
              <label class="btn stat-down" for="btn-filter-stat-down">↓ 1126</label>
              
              <input type="checkbox" class="btn-check" id="btn-filter-stat-flag" autocomplete="off">
              <label class="btn stat-flag" for="btn-filter-stat-flag">⚑ 68</label>
              
              <input type="checkbox" class="btn-check" id="btn-filter-stat-repeat" autocomplete="off">
              <label class="btn stat-repeat" for="btn-filter-stat-repeat">⟳ 59</label>
          </div>
          <!-- TRACK LIST -->
          <ul class="track-list">
              
          </ul>

      </div>

      <div class="detail"></div>
  </div>

  <template id="track-item-template">
      <li class="track-item">
          <a class="track-link">
              
              <div class="track-position">
                  <span class="track-position-value"></span>
                  <div class="track-status">
                      <span class="material-symbols-outlined track-delta-icon"></span>
                      <span class="track-delta-value"></span>
                  </div>
              </div>

              <div class="track-main">
                  <span class="track-title"></span>
                  <span class="track-artist"></span>
              </div>

          </a>
      </li>
  </template>
  

  <script type="module" src="/src/main.ts"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
